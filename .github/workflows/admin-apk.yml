name: Build Admin APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Point app at admin panel
        run: |
          node -e "const f='capacitor.config.json',c=JSON.parse(require('fs').readFileSync(f));c.appId='com.almilyar.admin';c.appName='إدارة المليار';c.server.url='https://almilyar-app.github.io/almilyar/admin.html';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Generate icons and splash
        run: npx capacitor-assets generate --android || true
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk almilyar-admin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: almilyar-admin-apk
          path: almilyar-admin.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-apk-${{ github.run_number }}
          name: إدارة المليار APK ${{ github.run_number }}
          files: almilyar-admin.apk
