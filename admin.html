<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>المليار – لوحة الإدارة</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--g:#e8c46b;--g2:#f6dd9a;--tx:#f6e8c8;--mut:#cdbb9f;--bd:rgba(216,178,90,.38);--ok:#8fdc7f;--wt:#e8b94a;--bad:#e58a7b}
html,body{margin:0;background:#150a05}
body{font-family:Tajawal,'Segoe UI',Tahoma,sans-serif;color:var(--tx);min-height:100vh}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:radial-gradient(120% 60% at 50% 0,#3a2012,#1b0f08 55%,#150a05);position:relative;padding:0 16px 110px}
button,input,select,textarea{font-family:inherit}
input,select,textarea{width:100%;padding:13px 14px;margin:6px 0;border-radius:16px;border:1px solid var(--bd);background:rgba(0,0,0,.28);color:var(--tx);font-size:15px;outline:0}
input::placeholder,textarea::placeholder{color:#8f7d63}
select option{background:#2a1a11}
.top{display:flex;align-items:center;gap:10px;padding:16px 2px 8px;position:sticky;top:0;z-index:5;background:#1f110a;margin:0 -16px;padding-inline:18px;border-bottom:1px solid rgba(216,178,90,.18)}
.top img{width:42px;height:42px;border-radius:12px}.top h1{margin:0;font-size:19px;color:var(--g2);flex:1}.top small{display:block;color:var(--mut);font-size:12px;font-weight:400}
.adm{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:rgba(216,178,90,.15);border:1px solid var(--bd);color:var(--g)}
.page{display:none}.page.on{display:block;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.card{border:1px solid var(--bd);border-radius:22px;padding:14px;margin-bottom:12px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(0,0,0,.2))}
.h3{font-size:17px;font-weight:800;color:var(--tx);margin:16px 4px 8px;display:flex;align-items:center;justify-content:space-between}
.h3 small{font-size:12.5px;color:var(--g);font-weight:700;cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{padding:14px 10px;border-radius:20px;border:1px solid var(--bd);background:linear-gradient(160deg,#35210f,#1e110a);text-align:center}
.st i{width:38px;height:38px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:rgba(216,178,90,.1);border:1px solid var(--bd)}
.st svg,.ni svg,.ic svg{width:21px;height:21px;fill:none;stroke:var(--g);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.st b{display:block;font-size:clamp(17px,5.4vw,22px);color:var(--g2);white-space:nowrap}.st small{font-size:12px;color:var(--mut)}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1;min-width:0}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(216,178,90,.1);border:1px solid var(--bd)}
.lnk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--bd);border-radius:20px;margin-bottom:10px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(0,0,0,.18));cursor:pointer}.lnk:active{transform:scale(.98)}
.lnk b{display:block;font-size:15.5px}.lnk small{color:var(--mut);font-size:12px}.lnk .n{min-width:28px;height:28px;border-radius:99px;display:grid;place-items:center;background:linear-gradient(135deg,#f7dd92,#c9993a);color:#2a1a11;font-weight:800;font-size:13px;padding:0 8px}.lnk .n.z{background:rgba(255,255,255,.08);color:var(--mut)}.lnk .ch{color:var(--g);font-size:22px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--bd);background:rgba(0,0,0,.25);color:var(--mut);border-radius:99px;padding:8px 14px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}.seg button.on{background:linear-gradient(135deg,#f0d283,#b48a34);color:#2a1a11;border-color:transparent}.seg button b{margin-inline-start:5px;font-size:11.5px;background:rgba(0,0,0,.25);color:#fff;border-radius:99px;padding:1px 7px}.seg button.on b{background:rgba(42,26,17,.85);color:var(--g2)}
.chip{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:99px;border:1px solid;white-space:nowrap;flex:none}
.chip.wait{color:var(--wt);border-color:rgba(224,169,58,.4);background:rgba(224,169,58,.12)}.chip.ok{color:var(--ok);border-color:rgba(123,211,107,.4);background:rgba(123,211,107,.12)}.chip.bad{color:var(--bad);border-color:rgba(224,112,95,.4);background:rgba(224,112,95,.1)}.chip.prog{color:#8fc4f0;border-color:rgba(100,170,230,.4);background:rgba(100,170,230,.1)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(216,178,90,.15);font-size:13.5px}.kv:last-child{border:0}.kv small{color:var(--mut)}.kv b{text-align:left;word-break:break-all;max-width:64%}
.btn{border:0;border-radius:99px;padding:12px;font-weight:800;font-size:14.5px;cursor:pointer;background:linear-gradient(135deg,#f7dd92,#c9993a);color:#2a1a11;width:100%}.btn.g{background:none;border:1px solid var(--bd);color:var(--g)}.btn.r{background:none;border:1px solid rgba(224,112,95,.5);color:var(--bad)}.btn.s{padding:9px;font-size:13px}
.acts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:10px}
.thumb{display:block;width:100%;max-height:120px;object-fit:cover;border-radius:14px;margin:8px 0 2px;border:1px solid var(--bd);cursor:zoom-in}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;justify-content:space-around;padding:8px 6px calc(10px + env(safe-area-inset-bottom));background:#0c0603;border-radius:26px 26px 0 0;border-top:1px solid rgba(216,178,90,.25);z-index:20}
.nav button{flex:1;border:0;background:none;color:var(--mut);font-size:11.5px;padding:7px 2px;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;font-weight:700}.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{background:linear-gradient(160deg,#5a3a1a,#3a2410);color:var(--g2);border:1px solid var(--bd)}
.nav .bd{position:absolute;top:2px;inset-inline-end:14px;min-width:17px;height:17px;border-radius:99px;background:#e0705f;color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.sh{width:100%;max-width:430px;max-height:88vh;overflow:auto;background:linear-gradient(#2a180d,#1a0e07);border:1px solid var(--bd);border-bottom:0;border-radius:28px 28px 0 0;padding:18px 16px 26px;animation:up .25s}@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh h3{margin:0 0 10px;font-size:18px;text-align:center;color:var(--g2)}
.upl{display:block;border:1.5px dashed var(--bd);border-radius:14px;padding:14px;text-align:center;color:var(--g2);font-weight:700;cursor:pointer;margin:4px 0}.upl small{display:block;color:#bfa87c;font-weight:400;margin-top:6px;font-size:12px}.xpi{width:120px;height:120px;object-fit:cover;border-radius:12px;display:block;margin:0 auto}
.fl{display:block;font-size:13.5px;color:#e5d3b3;margin:10px 4px 2px;font-weight:700}
.emp{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}
.sw{width:46px;height:27px;border-radius:99px;border:1px solid var(--bd);background:#2a1a11;position:relative;cursor:pointer;padding:0;flex:none}.sw i{position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;border-radius:50%;background:#8a7a62;transition:.2s}.sw.on{background:rgba(216,178,90,.35)}.sw.on i{background:var(--g2);inset-inline-start:22px}
.tg{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#f2e6cf;color:#2a1a11;font-weight:700;padding:10px 18px;border-radius:14px;z-index:99;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}.tg.on{opacity:1}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;color:#2a1a11;background:linear-gradient(145deg,#f7dd92,#b48a34);font-size:18px}
#login{position:fixed;inset:0;z-index:90;background:linear-gradient(160deg,#4a2e1d,#1d0f07);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}#login img{width:96px;border-radius:26px;margin-bottom:12px}#login h2{margin:0 0 4px;color:var(--g2)}#login small{color:var(--mut);margin-bottom:18px}#login .b{width:100%;max-width:340px}
.sub{font-size:12px;color:var(--mut)}
.up{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;border:1.5px dashed rgba(216,178,90,.55);border-radius:20px;background:rgba(0,0,0,.2);color:var(--g);font-size:14px;cursor:pointer;padding:12px;text-align:center;margin-top:6px}.up svg{width:28px;height:28px;fill:none;stroke:var(--g);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.up img{max-width:100%;max-height:150px;border-radius:12px}.up small{color:var(--mut)}.pim{width:46px;height:46px;border-radius:14px;object-fit:cover;flex:none;border:1px solid var(--bd)}
.bb{max-width:82%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.6;word-break:break-word;margin-bottom:8px}.bb small{display:block;font-size:10.5px;opacity:.7;margin-top:2px}.bb.u{margin-inline-end:auto;background:rgba(255,255,255,.08);border:1px solid var(--bd);border-bottom-right-radius:5px}.bb.a{margin-inline-start:auto;background:linear-gradient(135deg,#f0d283,#c9993a);color:#2a1a11;border-bottom-left-radius:5px}.thr{max-height:46vh;overflow-y:auto;padding:4px 2px;display:flex;flex-direction:column}
</style><style id="cscss">
.cpl{display:flex;gap:3px}.cpl i{width:14px;height:8px;border-radius:4px;background:#4a3322}.cpl i.on{background:#7bd36b}
#whw{position:relative;width:300px;height:300px;margin:6px auto}
#whw .pt{position:absolute;top:-6px;left:50%;margin-left:-14px;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid #f0cd7a;z-index:2;filter:drop-shadow(0 2px 3px #000)}
#whg{transform-origin:150px 150px;transition:transform 5.5s cubic-bezier(.12,.7,.1,1)}
</style>
