<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>المليار</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b110b;--surf:#2a1a11;--ink:#f3e6cf;--mut:#b39a7d;--gold:#d8b25a;--line:#4a3322;--ok:#7bd36b;--wait:#e0a93a;--bad:#e0705f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Tajawal',Tahoma,sans-serif;background:radial-gradient(circle at 80% 0,#4a2e1d,#1b110b 55%) fixed;color:var(--ink);max-width:430px;margin:0 auto;min-height:100vh;padding:18px 0 96px}
button,input,select{font-family:inherit;color:inherit}
.mode{width:max-content;white-space:nowrap;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;display:flex;background:#150d08;border:1px solid var(--line);border-radius:99px;padding:3px}
.mode button{border:0;background:none;padding:6px 16px;border-radius:99px;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer}.mode button.on{background:linear-gradient(135deg,#f0d283,#b48a34);color:#2a1a11}
.splash{position:fixed;inset:0;background:linear-gradient(160deg,#4a2e1d,#1d0f07);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:90;transition:opacity .5s,visibility 0s .5s}.splash.hide{opacity:0;visibility:hidden}
.logo{width:56px;height:56px;border-radius:17px;background:linear-gradient(145deg,#f0d283,#a8812f);display:grid;place-items:center;font-size:30px;font-weight:800;color:#2a1a11;margin:0 auto}
.splash .logo{width:84px;height:84px;font-size:44px;animation:pop .9s both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view{display:none}.view.on{display:block}
.page{display:none;padding:6px 18px;animation:fade .4s both}.page.on{display:block}
.brand{text-align:center;padding:8px 0}.brand b{display:block;font-size:20px;color:#e9d29b;margin-top:4px}
h2.t{font-size:18px;margin:14px 0 10px;font-weight:800}
.box{background:linear-gradient(160deg,#37231a,#2a1a11);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px}
.gold{border-color:var(--gold);box-shadow:0 0 18px rgba(216,178,90,.18)}
.card{border-radius:22px;padding:18px;background:radial-gradient(circle at 15% 0,#7a5434,#3a2417 55%,#241309);border:1px solid var(--line);box-shadow:0 14px 30px rgba(0,0,0,.4);position:relative;overflow:hidden;animation:float 5s ease-in-out infinite}
.card:after{content:"";position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(100deg,transparent,rgba(255,236,180,.3),transparent);transform:skewX(-20deg);animation:shine 3.6s 1s infinite}
@keyframes shine{0%{right:-100px}55%,100%{right:115%}}@keyframes float{50%{transform:translateY(-4px)}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.num{font-size:32px;font-weight:800;margin:6px 0;direction:ltr;text-align:right;color:#f6dd9a}
.eye{background:none;border:0;font-size:20px;cursor:pointer}
small,.mut{color:var(--mut);font-size:12px}
.tag{font-size:12px;padding:4px 14px;border-radius:8px;font-weight:800;background:linear-gradient(135deg,#f0d283,#b48a34);color:#2a1a11;display:inline-block}
.btn{width:100%;padding:14px;border:0;border-radius:99px;background:linear-gradient(135deg,#f0d283,#b48a34);color:#2a1a11;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px}.btn:active{transform:scale(.97)}.btn.g{background:#3a281b;color:var(--ink);border:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.kv:last-child{border:0}
.dev{display:flex;gap:12px;align-items:center}.dev .em{font-size:52px;width:80px;text-align:center}.dev>div:last-child{flex:1}
.pk{cursor:pointer}.pk:active{transform:scale(.98)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amt{font-size:36px;font-weight:800;color:#f6dd9a;text-align:center;direction:ltr;margin:8px 0}
.pre{padding:13px;border:1px solid var(--line);border-radius:99px;background:#2a1a11;text-align:center;font-weight:700;cursor:pointer;direction:ltr}.pre.on{background:linear-gradient(135deg,#f0d283,#b48a34);color:#2a1a11;border-color:transparent}
.pm{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:18px;margin-bottom:10px;cursor:pointer;background:#2a1a11;position:relative}.pm.on{border-color:var(--gold);box-shadow:0 0 14px rgba(216,178,90,.2)}
.pm .ic{width:48px;height:48px;border-radius:12px;background:#1b110b;display:grid;place-items:center;font-size:24px}.pm b{display:block}
.pm .ck{position:absolute;top:-8px;left:-8px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#2a1a11;display:none;place-items:center;font-size:14px;font-weight:800}.pm.on .ck{display:grid}
input,select{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:#2a1a11;font-size:16px;margin:6px 0}
.st{font-size:11.5px;padding:3px 10px;border-radius:99px;font-weight:700;white-space:nowrap}.st.ok{background:rgba(123,211,107,.15);color:var(--ok)}.st.wait{background:rgba(224,169,58,.15);color:var(--wait)}.st.bad{background:rgba(224,112,95,.15);color:var(--bad)}
.av{width:78px;height:78px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-size:38px;background:#1b110b;flex:none}
.li{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:#2a1a11;cursor:pointer}.li span:nth-child(2){flex:1;font-weight:700}
.chips,.seg{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}.seg button,.chips button{padding:8px 15px;border-radius:99px;border:1px solid var(--line);background:#2a1a11;font-size:13.5px;cursor:pointer;white-space:nowrap}.seg button.on,.chips button.on{background:linear-gradient(135deg,#f0d283,#b48a34);color:#2a1a11;font-weight:800;border-color:transparent}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.g4 .box{margin:0;text-align:center}.g4 b{display:block;font-size:20px;color:#f6dd9a}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#150d08;border-top:1px solid var(--line);display:flex;padding:8px 2px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:11px;cursor:pointer;padding:5px 0;border-radius:14px}nav button div{font-size:19px}nav button.on{color:var(--gold);font-weight:800;background:rgba(216,178,90,.12)}
.sheet{position:fixed;inset:0;background:rgba(5,2,1,.7);display:none;align-items:flex-end;z-index:60}.sheet.on{display:flex}.sheet>div{background:var(--bg);width:100%;max-width:430px;margin:0 auto;border-radius:26px 26px 0 0;padding:20px;max-height:90vh;overflow:auto;animation:fade .3s both}
.toast{position:fixed;top:60px;left:50%;transform:translate(-50%,-140px);background:#f3e6cf;color:#2a1a11;padding:12px 20px;border-radius:16px;transition:transform .4s;z-index:95;font-size:14px;font-weight:700;max-width:90%;text-align:center}.toast.on{transform:translate(-50%,0)}
.adm{background:#f6f1e7;color:#2b1d14;min-height:100vh}

.oc{position:relative;border:1.4px solid rgba(216,178,90,.45);border-radius:26px;padding:14px;margin-bottom:16px;background:linear-gradient(165deg,#3a2316,#22140c);cursor:pointer;overflow:hidden}
.oc.pr{border-color:#e8c46b;box-shadow:0 0 18px rgba(232,196,107,.35),inset 0 0 22px rgba(232,196,107,.12)}
.oc:active{transform:scale(.98)}
.oh,.dh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ot{flex:1;min-width:0}
.ot .tag{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 14px}
.on_{display:block;font-size:clamp(20px,6.4vw,26px);font-weight:800;color:#f6e8c8;margin:8px 0 4px;line-height:1.2}
.os{display:flex;align-items:center;gap:6px;font-size:13px;color:#d9c7a8}
.os svg,.or svg,.op svg{width:20px;height:20px;flex:none;stroke:#e8c46b;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.oi{width:30%;max-width:120px;flex:none;display:flex;justify-content:center}
.oi img{width:100%;height:auto;max-height:130px;object-fit:contain;border-radius:12px;-webkit-mask-image:radial-gradient(#000 62%,transparent 100%);mask-image:radial-gradient(#000 62%,transparent 100%)}
.oi .em2{font-size:60px}
.ob{margin-top:12px;border:1px solid rgba(216,178,90,.28);border-radius:20px;padding:6px 12px 12px;background:linear-gradient(160deg,rgba(120,70,35,.35),rgba(30,16,8,.45))}
.or{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid rgba(216,178,90,.25);font-size:15px;color:#e5d3b3}
.or>span,.op>span{display:flex;align-items:center;gap:8px}
.or b{font-size:clamp(17px,5vw,20px);color:#f6e8c8;font-weight:800}
.op{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:11px 14px;border-radius:99px;background:linear-gradient(135deg,#f7dd92,#c9993a);color:#2a1a11;font-weight:800;font-size:14px}
.op svg{stroke:#2a1a11}.op b{font-size:clamp(17px,5vw,20px)}
.od{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;padding:13px;border-radius:99px;background:linear-gradient(135deg,#f7dd92,#c9993a);color:#2a1a11;font-weight:800;font-size:18px}
.od i{width:28px;height:28px;border-radius:50%;background:#2a1a11;display:grid;place-items:center;color:#e8c46b;font-style:normal;font-size:16px}
.dtp{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dtp h3{flex:1;text-align:center;font-size:20px}
.xb{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#2a1a11;color:#f3e6cf;font-size:20px;cursor:pointer}
.dh{padding:6px 0}
.nt{display:flex;gap:10px;align-items:center;border:1px solid rgba(216,178,90,.4);border-radius:16px;padding:12px;margin-top:12px;font-size:14px;color:#e5d3b3}
.nt svg{width:26px;height:26px;flex:none;stroke:#e8c46b;fill:none;stroke-width:1.8}
.lim{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px dashed rgba(216,178,90,.55);border-radius:18px;padding:12px 14px;margin:-4px 0 14px;background:rgba(216,178,90,.07)}
.lim b{display:block;font-size:14px;color:#f6e8c8}.lim small{display:block;font-size:11.5px;color:#cdbb9f;margin-top:2px;line-height:1.5}
.lim .lc{font-size:20px;font-weight:800;color:#2a1a11;background:linear-gradient(135deg,#f7dd92,#c9993a);border-radius:12px;padding:6px 12px;direction:ltr}
.btn.dis{background:#3a281b;color:#cdbb9f;border:1px solid var(--line)}
.op{gap:8px;font-size:13px}.op>span{white-space:normal;line-height:1.35;gap:6px;flex:1;min-width:0;font-size:12.5px}.op b{white-space:nowrap;flex:none}
.or b{white-space:nowrap}
body.invp .brand{display:none}
html{background:#0b0705;overflow-x:hidden}body{overflow-x:hidden;width:100%}

img,svg{max-width:100%}

.oc{padding:12px;border-radius:24px;margin-bottom:14px}
.on_{font-size:clamp(19px,5.8vw,23px);margin:6px 0 3px}
.os{font-size:12px}.os svg,.or svg,.op svg{width:17px;height:17px}
.oi{width:27%;max-width:100px}
.ob{margin-top:8px;padding:2px 10px 10px;border-radius:18px}
.or{padding:8px 0;font-size:13px}.or b{font-size:clamp(15px,4.5vw,17px)}
.op{margin-top:6px;padding:7px 12px;gap:6px;font-size:12px;border-radius:99px}
.op>span{white-space:nowrap;font-size:12px;gap:5px;flex:1;min-width:0}
.op b{font-size:clamp(14px,4.2vw,16px);white-space:nowrap}
.od{margin-top:10px;padding:9px;font-size:16px;gap:8px}.od i{width:24px;height:24px;font-size:14px}

.op{padding:7px 10px;gap:8px}
.op>span{font-size:clamp(10.5px,3.1vw,12px);gap:4px;overflow:hidden;text-overflow:ellipsis}
.op svg{width:15px;height:15px}
.op b{font-size:clamp(12.5px,3.7vw,15px);display:flex;gap:4px;align-items:baseline;flex:none}

.op{padding:7px 9px;gap:6px}

.op svg{width:14px;height:14px}

.mk{display:inline-block;width:26px;height:26px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}

.shh{display:flex;align-items:center;gap:12px;margin:14px 0 14px}
.shh img{width:46px;height:42px;flex:none}.shh h2{font-size:clamp(24px,7.4vw,30px);font-weight:800;color:#f6e8c8}
.sch{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.sch button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:60px;border-radius:18px;border:1px solid rgba(216,178,90,.35);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(0,0,0,.2));color:#ecd9ac;font-size:clamp(11px,3.3vw,13px);font-weight:700;cursor:pointer;padding:0}

.sg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 8px 10px;border-radius:24px;border:1px solid rgba(216,178,90,.4);background:linear-gradient(165deg,#3a2316,#22140c);box-shadow:0 0 14px rgba(232,196,107,.12),inset 0 0 18px rgba(232,196,107,.06)}

.wbs svg{width:20px;height:20px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wb1{border:0;background:linear-gradient(135deg,#f7dd92,#c9993a);color:#2a1a11}.wb1 svg{stroke:#2a1a11}
.wb2{border:1px solid rgba(216,178,90,.5);background:rgba(0,0,0,.25);color:#f6e8c8}.wb2 svg{stroke:#e8d3a3}
.wt{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;color:#f6e8c8;margin:4px 2px 12px}.wt img{width:22px;height:22px}
.wm{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px}
.wtl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:76px;border-radius:18px;border:1px solid rgba(216,178,90,.35);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(0,0,0,.2));color:#ecd9ac;font-size:clamp(9.5px,2.9vw,11.5px);font-weight:700;cursor:pointer;padding:0 2px}
.wtl .lg{height:28px;display:flex;align-items:center;justify-content:center}.wtl .lg img{max-height:26px;max-width:92%;width:auto}
.wtl:active{transform:scale(.95)}
.wl{border:1px solid rgba(216,178,90,.35);border-radius:24px;padding:12px;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(0,0,0,.18));margin-bottom:12px}
.wlh{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px}.wlh b{display:flex;align-items:center;gap:8px;font-size:17px;color:#f6e8c8}.wlh img{width:24px;height:22px}
.wlh button{border:0;background:none;color:#e8d3a3;font-size:13px;cursor:pointer}
.lr{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid rgba(216,178,90,.22)}.lr:first-child{border-top:0}
.lr .ic2{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(216,178,90,.4);flex:none}.lr .ic2 svg{width:18px;height:18px;fill:none;stroke:#e8c46b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lr .tt{flex:1;min-width:0}.lr .tt b{display:block;font-size:15px;color:#f6e8c8}.lr .tt small{font-size:12px;color:#cdbb9f}
.lr .am2{text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:4px}.lr .am2 b{font-size:15px;direction:ltr;white-space:nowrap}
.lr .am2 b.g{color:#7bd36b}.lr .am2 b.r{color:#e0705f}.lr .am2 b.y{color:#e0a93a}
.lr .st{font-size:11px;padding:2px 10px}
.wl .emp{text-align:center;color:#cdbb9f;padding:18px}

.pc{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid rgba(216,178,90,.45);border-radius:26px;background:linear-gradient(160deg,#35210f,#1e110a);box-shadow:0 0 12px rgba(232,196,107,.08);margin-bottom:16px;cursor:pointer}
.avt{width:68px;height:68px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:30px;font-weight:800;color:#2a1a11;background:linear-gradient(145deg,#f7dd92,#b48a34);border:2px solid rgba(247,221,146,.5);overflow:hidden}
.avt img{width:100%;height:100%;object-fit:cover}
.pc .pi{flex:1;min-width:0}.pc .pn{font-size:clamp(18px,5.6vw,22px);font-weight:800;color:#f6e8c8}
.pc .pid{font-size:13px;color:#e8c46b;direction:ltr;text-align:right;letter-spacing:.5px;margin:3px 0 6px;font-weight:700}
.bds{display:flex;flex-wrap:wrap;gap:6px}.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid transparent}
.bdg.ok{background:rgba(123,211,107,.14);color:#8fdc7f;border-color:rgba(123,211,107,.35)}.bdg.wait{background:rgba(224,169,58,.14);color:#e8b94a;border-color:rgba(224,169,58,.35)}.bdg.no{background:rgba(224,112,95,.12);color:#e58a7b;border-color:rgba(224,112,95,.35)}
.arow{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid rgba(216,178,90,.38);border-radius:20px;margin-bottom:10px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(0,0,0,.18));cursor:pointer}.arow:active{transform:scale(.98)}
.arow .ai{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(216,178,90,.1);border:1px solid rgba(216,178,90,.3)}
.ai svg,.sicon svg{width:22px;height:22px;fill:none;stroke:#e8c46b;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.arow .at{flex:1;min-width:0}.arow .at b{display:block;font-size:16px;color:#f6e8c8}.arow .at small{font-size:12px;color:#cdbb9f}
.arow .ch{color:#e8c46b;font-size:22px;line-height:1}
.alo{width:100%;height:46px;border-radius:99px;border:1px solid rgba(224,112,95,.5);background:rgba(224,112,95,.07);color:#e58a7b;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;margin:6px 0 14px}.alo svg{width:20px;height:20px;fill:none;stroke:#e58a7b;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ac-title{font-size:17px;font-weight:800;color:#f6e8c8;margin:16px 4px 8px}
.dcard{border:1px solid rgba(216,178,90,.35);border-radius:22px;padding:4px 14px;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(0,0,0,.18));margin-bottom:12px}
.dcard .kv b{font-size:14px;max-width:62%;text-align:left;word-break:break-all}.dcard .kv small{font-size:13.5px;color:#cdbb9f}
.rl{border:1px solid rgba(216,178,90,.45);border-radius:20px;padding:12px;background:rgba(0,0,0,.25);direction:ltr;text-align:left;font-size:13px;color:#f6e8c8;word-break:break-all;margin-bottom:10px}
.cpb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:42px;border:0;border-radius:99px;background:linear-gradient(135deg,#f7dd92,#c9993a);color:#2a1a11;font-weight:800;font-size:15px;cursor:pointer;margin-bottom:12px}
.stat{display:flex;align-items:center;justify-content:space-between;padding:16px;border:1px solid rgba(216,178,90,.35);border-radius:20px;margin-bottom:10px;background:rgba(216,178,90,.06)}.stat small{font-size:14px;color:#cdbb9f}.stat b{font-size:22px;color:#f0cd7a}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.at2{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border:1px solid rgba(216,178,90,.38);border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(0,0,0,.2));cursor:pointer;text-align:center}.at2:active{transform:scale(.97)}
.at2 .sicon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(216,178,90,.4);background:rgba(216,178,90,.1)}
.at2 b{font-size:15px;color:#f6e8c8}.at2 .cnt{font-size:22px;font-weight:800;color:#f0cd7a}.at2 small{font-size:11.5px;color:#cdbb9f;margin-top:-4px}
.kyc{text-align:center;padding:20px 14px;border-radius:24px;border:1px solid rgba(216,178,90,.4);margin-bottom:14px;background:linear-gradient(160deg,#35210f,#1e110a)}
.kyc .big{width:76px;height:76px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:36px;border:2px solid}
.kyc.ok .big{border-color:#8fdc7f;color:#8fdc7f;background:rgba(123,211,107,.12)}.kyc.wait .big{border-color:#e8b94a;color:#e8b94a;background:rgba(224,169,58,.12)}.kyc.no .big{border-color:#e58a7b;color:#e58a7b;background:rgba(224,112,95,.1)}
.kyc h3{font-size:20px;color:#f6e8c8}.kyc small{color:#cdbb9f;display:block;margin-top:4px;line-height:1.6}
.req{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(216,178,90,.2);font-size:14px;color:#e5d3b3}.req:last-child{border:0}.req i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-style:normal;font-size:12px;border:1px solid rgba(216,178,90,.5);color:#e8c46b}.req.dn i{background:#8fdc7f;border-color:#8fdc7f;color:#142014}
.tl{position:relative;padding-inline-start:26px}.tl .st1{position:relative;padding:6px 0 14px;font-size:14px;color:#cdbb9f}.tl .st1:before{content:"";position:absolute;inset-inline-start:-26px;top:8px;width:14px;height:14px;border-radius:50%;border:2px solid #6b5538;background:#1b110b}.tl .st1.on{color:#f6e8c8}.tl .st1.on:before{background:#e8b94a;border-color:#e8b94a}.tl .st1:after{content:"";position:absolute;inset-inline-start:-20px;top:24px;bottom:-4px;width:2px;background:#4a3322}.tl .st1:last-child:after{display:none}
.sw{width:48px;height:28px;border-radius:99px;border:1px solid rgba(216,178,90,.45);background:#2a1a11;position:relative;cursor:pointer;padding:0;flex:none}.sw i{position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#8a7a62;transition:.2s}.sw.on{background:rgba(216,178,90,.35)}.sw.on i{background:#f0cd7a;inset-inline-start:23px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid rgba(216,178,90,.2)}.sr:last-child{border:0}.sr b{display:block;font-size:14.5px;color:#f6e8c8}.sr small{font-size:12px;color:#cdbb9f}
.mini{border:1px solid rgba(224,112,95,.5);background:none;color:#e58a7b;border-radius:99px;padding:5px 14px;font-size:12.5px;cursor:pointer}
.chg{display:block;margin:12px auto 0;border:0;background:none;color:#e8c46b;font-size:14px;text-decoration:underline;cursor:pointer}
.demo{display:block;margin:14px auto 4px;border:1px dashed rgba(216,178,90,.4);background:none;color:#cdbb9f;border-radius:99px;padding:7px 16px;font-size:12px;cursor:pointer}

.bc .amr{display:flex;align-items:center;gap:10px;margin-top:2px}.bc .amr .am{margin:0}
.eyeb{width:34px!important;height:34px!important;border-radius:50%!important;background:none!important;display:grid;place-items:center}.eyeb svg{width:24px;height:24px;fill:none;stroke:#e8c46b;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.eyeb .sl{opacity:0}.eyeb.off .sl{opacity:1}.eyeb.off:after{display:none!important}

.dtop{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid rgba(216,178,90,.5);border-radius:20px;background:linear-gradient(160deg,#35210f,#1e110a);margin-bottom:12px}
.dtop .lg2{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(216,178,90,.1);border:1px solid rgba(216,178,90,.3);font-size:24px;flex:none;overflow:hidden}.dtop .lg2 img{width:80%;height:80%;object-fit:contain}.dtop b{font-size:17px;color:#f6e8c8}.dtop small{display:block;color:#cdbb9f}
.tob{border:1px dashed rgba(216,178,90,.6);border-radius:20px;padding:12px 14px;margin-bottom:6px;background:rgba(216,178,90,.07)}.tob small{color:#cdbb9f;font-size:12.5px}.tob .tn{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}.tob .tn b{font-size:clamp(17px,5.4vw,21px);color:#f0cd7a;direction:ltr;letter-spacing:.5px}
.cp2{border:0;border-radius:99px;padding:8px 16px;background:linear-gradient(135deg,#f7dd92,#c9993a);color:#2a1a11;font-weight:800;font-size:13px;cursor:pointer;flex:none}
.fl2{display:block;font-size:14px;color:#e5d3b3;margin:14px 4px 6px;font-weight:700}.fl2 em{font-style:normal;color:#cdbb9f;font-weight:400;font-size:12px;display:block;margin-top:2px}
.up{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;border:1.5px dashed rgba(216,178,90,.55);border-radius:20px;background:rgba(0,0,0,.2);color:#e8c46b;font-size:14px;cursor:pointer;padding:12px;text-align:center}.up svg{width:28px;height:28px;fill:none;stroke:#e8c46b;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.up img{max-width:100%;max-height:190px;border-radius:12px}.up small{color:#cdbb9f}

#chat .chh{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(216,178,90,.25);background:#1f110a}
#chat .chh b{display:block;font-size:17px;color:#f6e8c8}#chat .chh small{color:#cdbb9f;font-size:12px}
#chat .chh .ci2{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(216,178,90,.12);border:1px solid rgba(216,178,90,.4);flex:none}
#chat .chh .ci2 svg,.cbk svg{width:22px;height:22px;fill:none;stroke:#e8c46b;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cbk{width:40px;height:40px;border-radius:50%;border:1px solid rgba(216,178,90,.45);background:none;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
#cmsgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.bb{max-width:80%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.6;word-break:break-word}.bb small{display:block;font-size:10.5px;opacity:.7;margin-top:3px}
.bb.u{align-self:flex-start;background:linear-gradient(135deg,#f0d283,#c9993a);color:#2a1a11;border-bottom-right-radius:6px}
.bb.a{align-self:flex-end;background:rgba(255,255,255,.08);border:1px solid rgba(216,178,90,.25);color:#f6e8c8;border-bottom-left-radius:6px}
#chat .chf{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid rgba(216,178,90,.25);background:#120a05}
#chat .chf input{flex:1;margin:0;border-radius:99px;padding:12px 16px}
#chat .chf button{width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,#f7dd92,#c9993a);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}#chat .chf button svg{width:21px;height:21px;fill:none;stroke:#2a1a11;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transform:scaleX(-1)}

.ni{display:block;width:26px;height:26px;margin:0 auto 4px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.ci{display:block;width:14px;height:25px;background:#e6bd6a;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
nav{border-radius:26px 26px 0 0;background:#0b0705;border-top:1px solid rgba(216,178,90,.28);padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));gap:4px}
nav button{color:#f1e6c9;font-size:11.5px;border:1px solid transparent;border-radius:18px;padding:8px 0 6px}
nav button.on{color:#fedf98;font-weight:800;background:linear-gradient(160deg,#6b4310,#3f260a);border-color:rgba(216,178,90,.35)}
#uv.ishome>.brand{display:none}
.hhead{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 16px}
.htitle b{display:block;font-size:clamp(20px,6vw,24px);color:#f6dd9a;line-height:1.25;font-weight:800}.htitle small{font-size:13px;color:#cbb99c}
.hbtns{display:flex;gap:10px}
.ib{width:50px;height:50px;border-radius:50%;border:0;background-size:cover;background-position:center;cursor:pointer;padding:0;flex:none}
.bc{position:relative;border-radius:24px;border:1.5px solid #d9b45f;background:radial-gradient(circle at 70% 30%,#3a1f0a,#1d0d03 60%,#140903);box-shadow:0 0 24px rgba(216,178,90,.28),inset 0 0 30px rgba(0,0,0,.45);overflow:hidden;min-height:0;display:flex;animation:float 5s ease-in-out infinite}
.bc svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bc .cr{flex:1;min-width:0;padding:28px 16px 14px;position:relative;z-index:1;display:flex;flex-direction:column}
.bc .cl{width:36%;flex:none;align-self:center;border-right:1px solid rgba(216,178,90,.38);padding:14px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;z-index:1}
.bc .nm{font-size:clamp(18px,5.6vw,22px);font-weight:800;color:#f6e8c8}
.bc .lb{font-size:13px;color:#d9ad5e;margin-top:6px}
.bc .am{font-size:clamp(22px,7.4vw,30px);white-space:nowrap;font-weight:800;color:#f9e6b8;margin-top:2px;line-height:1.25}.bc .am span{font-size:.8em}
